{% extends 'posts/base.html' %}

{% block title %}Editar perfil | Blog Django{% endblock %}

{% block content %}
<section>
    <h1>Editar perfil</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ usuario_form.as_p }}
        {{ perfil_form.as_p }}
        <button type="submit">Guardar</button>
    </form>
    <p><a href="{% url 'perfil' %}">Cancelar</a></p>
</section>
{% endblock %}
