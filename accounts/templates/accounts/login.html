{% extends 'posts/base.html' %}

{% block title %}Iniciar sesión | Blog Django{% endblock %}

{% block content %}
<section>
    <h1>Iniciar sesión</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
    <p>¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
</section>
{% endblock %}
