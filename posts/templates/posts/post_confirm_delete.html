{% extends 'posts/base.html' %}

{% block title %}Eliminar post | Blog Django{% endblock %}

{% block content %}
<section>
    <h1>Eliminar post</h1>
    <p>¿Seguro que querés eliminar "<strong>{{ post.titulo }}</strong>"? Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'detalle_post' post.pk %}">Cancelar</a>
    </form>
</section>
{% endblock %}
