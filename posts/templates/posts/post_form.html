{% extends 'posts/base.html' %}

{% block title %}{{ accion }} post | Blog Django{% endblock %}

{% block content %}
<section>
    <h1>{{ accion }} post</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>

    <p><a href="{% url 'lista_posts' %}">Cancelar</a></p>
</section>
{% endblock %}
